<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구글 드라이브 오디오 재생</title>
    <style>
        /* 플레이어를 화면 가운데로 예쁘게 정렬하기 위한 간단한 디자인(CSS)입니다 */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            font-family: sans-serif;
        }
        .player-container {
            background: white;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h3>🎵 내 오디오 플레이어</h3>
        <audio controls>
            <source src="https://docs.google.com/uc?export=open&id=1Z5VJyQfhQAa8S32LN8XxHjSjgI1LuIpw" type="audio/mp4">
            브라우저가 오디오 태그를 지원하지 않습니다.
        </audio>
    </div>

</body>
</html>
